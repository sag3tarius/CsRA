<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Military Thermostat Simulation</title>

<style>
body {
    background-color: #1a1a1a;
    font-family: Consolas, monospace;
    color: #00ff99;
    text-align: center;
    padding: 20px;
}

.panel {
    border: 3px solid #00ff99;
    padding: 20px;
    width: 520px;
    margin: auto;
    border-radius: 8px;
    background-color: #0d0d0d;
}

button {
    width: 90px;
    margin: 5px;
    padding: 10px;
    font-size: 16px;
    background-color: #003300;
    color: #00ff99;
    border: 2px solid #00ff99;
    cursor: pointer;
}
button.active {
    background-color: #00ff99;
    color: #000;
}

/* DIAL */
#dialWrapper {
    margin-top: 20px;
}
#dial {
    width: 200px;
    transition: transform 0.4s ease-out;
}
#dialNeedle {
    stroke-width: 3;
}

.readout {
    margin-top: 20px;
    font-size: 18px;
}

.warning {
    margin-top: 10px;
    font-size: 16px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="panel">
    <h2>MIL-THERMO CONTROL MODULE</h2>
    <h3>Simulated Unit: Lumikko 150kW HVAC</h3>

    <!-- MODE BUTTONS -->
    <button id="heatBtn">HEAT</button>
    <button id="coolBtn">COOL</button>
    <button id="offBtn">OFF</button>

    <!-- TARGET TEMP DIGITAL READOUT -->
    <div id="targetReadout" style="margin-top:20px; font-size:22px;">
        TARGET TEMP: 70°F
    </div>

    <!-- INTERNAL TEMP DIAL -->
    <div id="dialWrapper">
        <svg id="dial" viewBox="0 0 100 100">
            <circle id="dialRing" cx="50" cy="50" r="45" stroke="#00ff99" stroke-width="4" fill="none"/>
            <line id="dialNeedle" x1="50" y1="50" x2="50" y2="10" stroke="#00ff99"/>
        </svg>
    </div>

    <!-- SLIDER -->
    <br>
    <label>Set Target Temp (°F):</label>
    <input type="range" id="targetTemp" min="-50" max="200" step="1" value="70">
    <div id="tempDisplay">70°F</div>

    <!-- READOUTS -->
    <div class="readout">
        <div id="currentMode">MODE: OFF</div>
        <div id="dayNightStatus">TIME MODE: --</div>
        <div id="avgTempDisplay">EXT AVG TEMP: --</div>
        <div id="internalTempDisplay">INTERNAL TEMP: --</div>
        <div id="dutyDisplay">DUTY CYCLE: --</div>
        <div id="etaDisplay">ETA TO TARGET: --</div>
        <div id="warningDisplay" class="warning"></div>
    </div>
</div>

<script>
/*************************************************************
 * CLIMATE DATA
 *************************************************************/
const avgDay   = [55.6,60.0,68.6,76.7,83.1,88.8,91.3,89.9,85.0,76.2,67.7,58.9];
const avgNight = [32.4,34.7,42.3,48.9,57.3,65.0,68.6,67.9,62.3,50.2,41.7,34.8];

/*************************************************************
 * UI ELEMENTS
 *************************************************************/
const heatBtn = document.getElementById("heatBtn");
const coolBtn = document.getElementById("coolBtn");
const offBtn  = document.getElementById("offBtn");

const targetTempSlider = document.getElementById("targetTemp");
const targetReadout    = document.getElementById("targetReadout");

const tempDisplay      = document.getElementById("tempDisplay");
